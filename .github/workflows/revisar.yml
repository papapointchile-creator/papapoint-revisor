name: Revisar máquinas PapaPoint

on:
  schedule:
    # Cada 7 minutos. Las horas van en UTC y cubren 05:45 a 23:30 de Santiago en invierno y en verano;
    # el primer paso apaga la corrida si en Santiago está fuera de ese horario.
    - cron: '*/7 8-23,0-3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: revisar-maquinas
  cancel-in-progress: false

jobs:
  revisar:
    # (22-10-2026) Fijo en Ubuntu 24.04: "ubuntu-latest" se está pasando a Ubuntu 26 desde el 19-10
    # y ahí la instalación del navegador se quedaba pegada hasta cortar la corrida (tope de 9 min).
    runs-on: ubuntu-24.04
    timeout-minutes: 9   # la corrida se queda ~3,5 min mirando pedidos en curso
    steps:
      - name: ¿Está en horario? (05:45 a 23:30 de Santiago)
        id: hora
        run: |
          H=$(TZ=America/Santiago date +%H%M)
          if (( 10#$H >= 545 && 10#$H <= 2330 )) || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "activo=1" >> "$GITHUB_OUTPUT"
          else
            echo "Fuera de horario ($H en Santiago): no se revisa."
            echo "activo=0" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.hora.outputs.activo == '1'

      - uses: actions/setup-node@v4
        if: steps.hora.outputs.activo == '1'
        with:
          node-version: 20

      - name: Recuperar sesión guardada
        if: steps.hora.outputs.activo == '1'
        uses: actions/cache/restore@v4
        with:
          path: .sesion
          key: sesion-${{ github.run_id }}
          restore-keys: sesion-

      - name: Instalar Playwright
        if: steps.hora.outputs.activo == '1'
        id: pw
        timeout-minutes: 2
        run: |
          npm install --no-save --no-package-lock playwright@1
          echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      # (22-10-2026) El navegador queda guardado en el cache: no se baja de nuevo en cada corrida.
      - name: Recuperar navegador guardado
        if: steps.hora.outputs.activo == '1'
        id: navcache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: navegador-${{ runner.os }}-24.04-${{ steps.pw.outputs.version }}

      # (22-10-2026) Sin "--with-deps": la máquina de GitHub (Ubuntu 24.04) ya trae Chrome y todas sus librerías;
      # lo lento era apt bajando fuentes y paquetes que no se usan (llegaba a 8 min).
      - name: Instalar navegador
        if: steps.hora.outputs.activo == '1' && steps.navcache.outputs.cache-hit != 'true'
        timeout-minutes: 4
        run: npx playwright install chromium

      - name: Guardar navegador
        if: steps.hora.outputs.activo == '1' && steps.navcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: navegador-${{ runner.os }}-24.04-${{ steps.pw.outputs.version }}

      - name: Revisar máquinas, ventas y avisar
        if: steps.hora.outputs.activo == '1'
        timeout-minutes: 6
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_PASS: ${{ secrets.VM_PASS }}
          VMADMIN_USER: ${{ secrets.VMADMIN_USER }}
          VMADMIN_PASS: ${{ secrets.VMADMIN_PASS }}
          PAYSCAN_USER: ${{ secrets.PAYSCAN_USER }}
          PAYSCAN_PASS: ${{ secrets.PAYSCAN_PASS }}
          PP_LLAVE: ${{ secrets.PP_LLAVE }}
        run: node revisar.js

      - name: Guardar sesión
        if: always() && steps.hora.outputs.activo == '1' && hashFiles('.sesion/state.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: .sesion
          key: sesion-${{ github.run_id }}

      - name: Guardar estado en el repositorio
        if: always() && steps.hora.outputs.activo == '1'
        run: |
          git config user.name "papapoint-revisor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json 2>/dev/null || true
          git add ventas.enc 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Estado de las máquinas" && (git push || (git pull --rebase -q && git push)))

      - name: Subir pantallazos si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
